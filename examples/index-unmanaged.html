<!DOCTYPE html>
<html lang="en">
<head>
	<title>CubemapToEquirectangular - Unmanaged</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<style>
		body {
			font-family: Monospace;
			background-color: #f0f0f0;
			color: white;
			margin: 0px;
			overflow: hidden;
		}
		#capture{
			position: absolute;
			left: 20px;
			top: 20px;
			padding: 10px;
			border: 1px solid white;
			z-index: 100;
			cursor: pointer;
			background-color: rgba( 0,0,0,.4);
		}
	</style>
</head>
<body>

	<div id="capture" >Capture</div>

	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
			}
		}
	</script>

	<script type="module">

		import * as THREE from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { CubemapToEquirectangular } from '../src/CubemapToEquirectangular.js';

		let equi;

		let camera, scene, renderer;
		let controls;

		let cubeCamera;

		init();
		animate();

		function init() {

			const container = document.createElement( 'div' );
			document.body.appendChild( container );

			camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 1, 10000 );
			camera.position.set( 1,1,1 );

			scene = new THREE.Scene();

			const light = new THREE.DirectionalLight( 0xffffff, 3 );
			light.position.set( 1, 1, 1 ).normalize();
			scene.add( light );

			const geometry = new THREE.BoxGeometry( 20, 20, 20 );

			for ( let i = 0; i < 2000; i ++ ) {

				const object = new THREE.Mesh( geometry, new THREE.MeshLambertMaterial() );

				object.position.x = Math.random() * 800 - 400;
				object.position.y = Math.random() * 800 - 400;
				object.position.z = Math.random() * 800 - 400;

				object.rotation.x = Math.random() * 2 * Math.PI;
				object.rotation.y = Math.random() * 2 * Math.PI;
				object.rotation.z = Math.random() * 2 * Math.PI;

				object.scale.x = Math.random() + 0.5;
				object.scale.y = Math.random() + 0.5;
				object.scale.z = Math.random() + 0.5;

				object.material.color.setRGB( object.position.x / 800 + .5, object.position.y / 800 + .5, object.position.z / 800 + .5, THREE.SRGBColorSpace );

				scene.add( object );

			}

			renderer = new THREE.WebGLRenderer( { alpha: false });
			renderer.setClearColor( 0xf0f0f0, 1 );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.sortObjects = false;
			container.appendChild(renderer.domElement);

			equi = new CubemapToEquirectangular( renderer, false );

			// half float keeps the linear colors intact, mipmaps let the panorama be filtered
			cubeCamera = new THREE.CubeCamera( .1, 1000, new THREE.WebGLCubeRenderTarget( 2048, {
				type: THREE.HalfFloatType,
				generateMipmaps: true,
				minFilter: THREE.LinearMipmapLinearFilter
			} ) );

			controls = new OrbitControls( camera, renderer.domElement );

			window.addEventListener( 'resize', onWindowResize, false );
			onWindowResize();

			document.getElementById( 'capture' ).addEventListener( 'click', function( e ) {

				cubeCamera.position.copy( camera.position );
				cubeCamera.update( renderer, scene );
				equi.convert( cubeCamera );

			} );

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize( window.innerWidth, window.innerHeight );

		}


		function animate() {

			requestAnimationFrame( animate );

			controls.update();
			render();

		}

		function render() {

			renderer.render( scene, camera );

		}

	</script>

</body>
</html>
